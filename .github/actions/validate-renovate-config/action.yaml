name: Validate renovate config
description: Renovate silently falls back to its defaults on a broken config, so validate it explicitly in CI.
inputs:
  config-file:
    description: Renovate config file(s), space separated; empty lets renovate-config-validator auto-discover it
    required: false
    default: ''
  extra-paths:
    description: Additional path globs, one per line, whose change also triggers the validation
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Build the change filter
      id: paths
      shell: bash
      env:
        CONFIG_FILE: ${{ inputs.config-file }}
        EXTRA_PATHS: ${{ inputs.extra-paths }}
      run: |
        set -euo pipefail
        if [ -n "$CONFIG_FILE" ]; then
          # shellcheck disable=SC2086
          paths=$(printf '%s\n' $CONFIG_FILE)
        else
          # renovate-config-validator's auto-discovery list, minus package.json: a `renovate` key
          # there is rare and would rerun this on every dependency bump.
          paths=$(printf '%s\n' \
            renovate.json renovate.json5 \
            .github/renovate.json .github/renovate.json5 \
            .gitlab/renovate.json .gitlab/renovate.json5 \
            .renovaterc .renovaterc.json .renovaterc.json5)
        fi
        {
          echo 'filters<<FILTERS'
          echo 'config:'
          printf '%s\n%s\n' "$paths" "$EXTRA_PATHS" | sed -n "s/^[[:space:]]*\(.\+\)$/  - '\1'/p"
          echo 'FILTERS'
        } >> "$GITHUB_OUTPUT"

    # paths-filter fetches a missing base commit with plain git. Callers check out with
    # persist-credentials: false, so in a private repo that fetch has no credentials and fails.
    # This step fetches the base with the job token instead, and paths-filter then finds it locally.
    - name: Fetch the diff base
      id: base
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        EVENT: ${{ github.event_name }}
        PR_BASE: ${{ github.event.pull_request.base.sha }}
        PUSH_BEFORE: ${{ github.event.before }}
        GH_TOKEN: ${{ github.token }}
        GIT_TERMINAL_PROMPT: '0'
      run: |
        set -euo pipefail
        base=''
        case "$EVENT" in
          pull_request) base=$PR_BASE ;;
          push) [[ $PUSH_BEFORE =~ ^0+$ ]] || base=$PUSH_BEFORE ;;  # all zeros: a new branch or tag has no before
        esac
        if [ -n "$base" ] && ! git cat-file -e "$base^{commit}" 2> /dev/null; then
          # Git asks a credential helper only after a 401. A checkout that kept its credentials
          # so sends only those, never a second Authorization header.
          # shellcheck disable=SC2016
          git -c credential.helper= \
            -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' \
            fetch --no-tags --depth=1 origin "$base"
        fi
        echo "sha=$base" >> "$GITHUB_OUTPUT"

    - name: Did the config change
      id: filter
      # Only pull_request and push carry a base to diff against. Every other event validates unconditionally.
      if: steps.base.outputs.sha != ''
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
      with:
        token: ''  # git diff instead of the PR files API, which needs pull-requests: read from every caller
        base: ${{ steps.base.outputs.sha }}  # a push to another branch would otherwise make paths-filter fetch the default branch
        filters: ${{ steps.paths.outputs.filters }}

    - name: Pin Node for npx
      if: steps.filter.outcome == 'skipped' || steps.filter.outputs.config == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version: 24  # renovate's engines field wants ^24; the runner image default moves under us otherwise

    - name: Validate renovate config
      if: steps.filter.outcome == 'skipped' || steps.filter.outputs.config == 'true'
      shell: bash
      env:
        RENOVATE_VERSION: 45.3.2
        CONFIG_FILE: ${{ inputs.config-file }}
      run: |
        set -euo pipefail
        # shellcheck disable=SC2086
        npx --yes --package "renovate@$RENOVATE_VERSION" -- renovate-config-validator --strict $CONFIG_FILE
