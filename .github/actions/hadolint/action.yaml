name: Hadolint
description: >-
  Runs a pinned hadolint over a repo's Dockerfiles, against the repo's own .hadolint.yaml
  when it has one and the shared config in this repo otherwise.
inputs:
  dockerfiles:
    description: >-
      Dockerfiles to lint. Empty discovers Dockerfile* recursively, skipping .git and
      node_modules.
    required: false
    default: ''
runs:
  using: composite
  steps:
    # A failed download skips the lint with a warning, so a GitHub outage does not stop a build.
    - name: install hadolint
      id: install
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RETRY_SH: ${{ github.action_path }}/../../../scripts/retry.sh
      run: |
        set -euo pipefail
        source "$RETRY_SH"
        case "$(uname -m)" in
          aarch64) arch=arm64 ;;
          x86_64) arch=x86_64 ;;
          *) echo "::error::unsupported runner architecture $(uname -m)" && exit 1 ;;
        esac
        dir="$(mktemp -d)"
        if ! retry_release_download hadolint/hadolint v2.12.0 "$dir" "hadolint-Linux-${arch}"; then
          echo "::warning::hadolint could not be downloaded from GitHub, so the Dockerfiles were not linted"
          exit 0
        fi
        mv "$dir/hadolint-Linux-${arch}" "$dir/hadolint"
        chmod +x "$dir/hadolint"
        sudo ln -sf "$dir/hadolint" /usr/local/bin/hadolint
        hadolint --version
        echo "installed=true" >> "$GITHUB_OUTPUT"

    - name: hadolint
      if: steps.install.outputs.installed == 'true'
      shell: bash
      env:
        DOCKERFILES: ${{ inputs.dockerfiles }}
        # a composite action runs out of a checkout of the repo it lives in, so this is gha's root
        SHARED_CONFIG: ${{ github.action_path }}/../../../.hadolint.yaml
      run: |
        set -euo pipefail
        if [ -f .hadolint.yaml ]; then config=.hadolint.yaml; else config="$SHARED_CONFIG"; fi
        if [ -n "$DOCKERFILES" ]; then
          # the input is a whitespace-separated list of paths and globs, so it has to split
          # shellcheck disable=SC2206
          files=($DOCKERFILES)
        else
          mapfile -t files < <(
            find . \( -name .git -o -name node_modules \) -prune -o -type f -name 'Dockerfile*' -print \
              | LC_ALL=C sort
          )
        fi
        if [ "${#files[@]}" -eq 0 ]; then
          echo "no Dockerfiles found"
          exit 0
        fi
        echo "config: $config"
        hadolint --config "$config" "${files[@]}"
