name: Shell checks
description: >-
  Runs a pinned shellcheck and shfmt over a repo's shell scripts. shellcheck policy
  (severity, suppressed codes) belongs in the repo's own .shellcheckrc, which shellcheck
  reads on its own, so this action passes neither -S nor -e.
inputs:
  paths:
    description: >-
      Files to check. Empty discovers *.sh plus extensionless files whose first line is a
      bash shebang, skipping .git, node_modules and charts/*/charts.
    required: false
    default: ''
runs:
  using: composite
  steps:
    # Pinned rather than taken from the runner image, which ships 0.9.0: a runner-image bump
    # would otherwise red-light six repos at once.
    - name: install shellcheck and shfmt
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RETRY_SH: ${{ github.action_path }}/../../../scripts/retry.sh
      run: |
        set -euo pipefail
        source "$RETRY_SH"
        case "$(uname -m)" in
          aarch64) sc_arch=aarch64 shfmt_arch=arm64 ;;
          x86_64) sc_arch=x86_64 shfmt_arch=amd64 ;;
          *) echo "::error::unsupported runner architecture $(uname -m)" && exit 1 ;;
        esac
        dir="$(mktemp -d)"
        sc_tarball="shellcheck-v0.10.0.linux.${sc_arch}.tar.xz"
        retry_release_download koalaman/shellcheck v0.10.0 "$dir" "$sc_tarball"
        tar -xJf "$dir/$sc_tarball" -C "$dir" --strip-components=1 "shellcheck-v0.10.0/shellcheck"
        rm "$dir/$sc_tarball"
        retry_release_download mvdan/sh v3.10.0 "$dir" "shfmt_v3.10.0_linux_${shfmt_arch}"
        mv "$dir/shfmt_v3.10.0_linux_${shfmt_arch}" "$dir/shfmt"
        chmod +x "$dir/shfmt"
        # /usr/local/bin comes before /usr/bin on PATH, so the pinned shellcheck wins over the image's.
        sudo ln -sf "$dir/shellcheck" "$dir/shfmt" /usr/local/bin/
        shellcheck --version
        shfmt --version

    - name: resolve paths
      id: paths
      shell: bash
      env:
        PATHS: ${{ inputs.paths }}
      run: |
        set -euo pipefail
        list="$(mktemp)"
        if [ -n "$PATHS" ]; then
          # the input is a whitespace-separated list of paths and globs, so it has to split
          # shellcheck disable=SC2086
          printf '%s\n' $PATHS > "$list"
        else
          find . \( -name .git -o -name node_modules -o -path './charts/*/charts' \) -prune -o -type f -print \
            | while IFS= read -r f; do
              case "${f##*/}" in
                *.sh) echo "$f" ;;
                *.*) ;;
                *)
                  if head -n 1 "$f" | grep -qE '^#!.*bash'; then echo "$f"; fi
                  ;;
              esac
            done | LC_ALL=C sort > "$list"
        fi
        echo "list=$list" >> "$GITHUB_OUTPUT"
        echo "checking $(wc -l < "$list") file(s)"
        cat "$list"

    - name: shellcheck
      shell: bash
      env:
        LIST: ${{ steps.paths.outputs.list }}
      run: |
        set -euo pipefail
        mapfile -t files < "$LIST"
        if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
        shellcheck "${files[@]}"

    # shfmt takes its options from .editorconfig, which no repo here has, and any printer flag
    # on the command line turns that lookup off, so a stray .editorconfig cannot move CI.
    - name: shfmt
      shell: bash
      env:
        LIST: ${{ steps.paths.outputs.list }}
      run: |
        set -euo pipefail
        mapfile -t files < "$LIST"
        if [ "${#files[@]}" -eq 0 ]; then exit 0; fi
        shfmt -d -i 2 -ci -bn -sr "${files[@]}"
