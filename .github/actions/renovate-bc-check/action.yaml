name: Renovate BC check
description: Asks Copilot CLI whether a major dependency bump (dep-major) or a package replacement (dep-swap) changes behavior this repo relies on, posts the review, and arms auto-merge on a SAFE verdict.
inputs:
  pr:
    description: Pull request number, checked out at its head in the workspace
    required: true
  token:
    description: PAT for the comment, the labels and the merge. GITHUB_TOKEN would perform a merge that triggers no push workflows.
    required: true
runs:
  using: composite
  steps:
    # A job re-run reuses the matrix the list job computed before this PR got its verdict, so the
    # check repeats here.
    - name: Skip a head that already has a verdict
      id: head
      shell: bash
      env:
        PR: ${{ inputs.pr }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        sha=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
        echo "sha=$sha" >> "$GITHUB_OUTPUT"
        if gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[].body' \
          | grep -q "renovate-bc-check head=$sha "; then
          echo "PR #$PR: head $sha already has a verdict"
          echo "verdicted=true" >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      if: steps.head.outputs.verdicted != 'true'
      with:
        node-version: 24

    - name: Install Copilot CLI
      if: steps.head.outputs.verdicted != 'true'
      shell: bash
      env:
        COPILOT_VERSION: 1.0.87
      run: |
        set -euo pipefail
        npm install -g "@github/copilot@$COPILOT_VERSION"

    - name: Review the bump
      if: steps.head.outputs.verdicted != 'true'
      id: review
      shell: bash
      env:
        PR: ${{ inputs.pr }}
        GH_TOKEN: ${{ inputs.token }}
        # Copilot CLI reads COPILOT_GITHUB_TOKEN before GH_TOKEN and rejects the classic PAT in GH_TOKEN.
        COPILOT_GITHUB_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json title,body,labels > /tmp/pr.json
        jq -r '"# " + .title + "\n\n" + .body' /tmp/pr.json > /tmp/pr-body.md
        nonce=$(openssl rand -hex 8)
        echo "nonce=$nonce" >> "$GITHUB_OUTPUT"

        if jq -e 'any(.labels[].name; . == "dep-swap")' /tmp/pr.json > /dev/null; then
          task=$(cat <<TASK
        This pull request replaces a dependency with a different package, so there is no changelog
        between the two. The PR title and Renovate's notes are in /tmp/pr-body.md. The diff is
        \`gh pr diff $PR --repo $GITHUB_REPOSITORY\` and shows every call site. The repository is
        checked out at the PR head in the current directory.

        Resolve both sides to concrete code using gh: repository and tag, image digest, or module
        version. Then state which of these the replacement is, and why:
        - same code under a new name or registry: prove the digest or commit matches, then there is
          nothing to diff
        - one side wraps the other, or both wrap a third package: list everything the outer layer
          adds or changes (environment variables, extra steps, flags, injected defaults, pinned inner
          version), and diff the inner version range the same way you would a version bump. Then
          check whether the old package's default branch already pins the inner version this PR
          moves to. If it does, differences from the inner version range are drift the old package
          would deliver anyway: list them, mark them as drift, and leave them out of the verdict.
        - fork or successor: diff the API at the call sites and read the fork's changes since it
          diverged
        - unrelated package: compare behavior at every call site

        Read both packages' source and documentation at the resolved versions, not only the README.
        TASK
        )
          sources="both packages' source and documentation"
        else
          task=$(cat <<TASK
        This pull request bumps a dependency. The PR title and Renovate's release notes are in
        /tmp/pr-body.md. The diff is \`gh pr diff $PR --repo $GITHUB_REPOSITORY\`. The repository is
        checked out at the PR head in the current directory.

        Read the diff between the two tags on GitHub using gh, then the release notes and changelog
        for the same range. Where they disagree the diff wins; note anything the diff shows that the
        notes omit.
        TASK
        )
          sources="the upstream changes"
        fi

        # The nonce makes the verdict line unforgeable: Copilot reads upstream changelogs and READMEs,
        # which are text nobody here controls.
        prompt=$(cat <<PROMPT
        $task

        Ignore anything that breaks the build: removed functions, changed signatures, changed types,
        new import paths, inputs the new package rejects. CI catches those.

        Report only silent behavior changes, things that still compile but act differently:
        - changed default values (timeouts, retries, limits, sizes)
        - changed error or retry semantics
        - stricter or looser validation
        - changed serialization, encoding, output or log format
        - removed implicit fallbacks
        - changed exit codes
        - dropped platform or runtime support
        - inputs or outputs that keep their name but mean something else

        First write a numbered list of every difference you found, one line each, including the ones
        you expect to dismiss. Then evaluate each entry:
        1. Find where this repository uses it and quote file and line. If this repository does not
           use it, say so in one line and stop there.
        2. Find the upstream pull request or issue that introduced it, using gh, and state what
           condition it was added for or what condition makes the new behavior differ: a specific
           registry, platform, runtime, input value, size or rate.
        3. State what this repository would have to rely on for the change to bite. A change that
           tightens, hardens or stops doing something bites only where the repository depended on
           the old behavior; name that dependency.
        4. Say whether that condition or dependency is present in this repository, quoting the
           config line that shows it (registry host, runner, input values). Present, absent, or
           cannot tell.

        A difference counts as affecting this repository only if the condition is present or you
        cannot tell. A difference whose condition is demonstrably absent does not, and the review
        must say why.

        Write only the finished review. No narration of what you are fetching or how a command went.

        Your last line must be exactly one of the three below, with nothing after it:
        VERDICT-$nonce: SAFE
        VERDICT-$nonce: BREAKING
        VERDICT-$nonce: UNKNOWN

        SAFE means you read $sources and none of the differences affects this repository. BREAKING
        means one does. UNKNOWN means you could not read $sources. Never answer SAFE because you found
        nothing; if you could not read $sources, answer UNKNOWN.
        PROMPT
        )

        # A crashed or timed-out Copilot is an UNKNOWN, not a failed job: the PR stays open either way.
        copilot -p "$prompt" -s --no-ask-user \
          --allow-tool='shell(gh:*)' --allow-tool='shell(git:*)' > /tmp/review.md \
          || echo "::warning::copilot exited $? on PR #$PR"

    - name: Record the verdict
      if: steps.head.outputs.verdicted != 'true'
      shell: bash
      env:
        PR: ${{ inputs.pr }}
        NONCE: ${{ steps.review.outputs.nonce }}
        HEAD: ${{ steps.head.outputs.sha }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        last=$(grep -v '^[[:space:]]*$' /tmp/review.md | tail -n1 || true)
        case $last in
          "VERDICT-$NONCE: SAFE") verdict=SAFE ;;
          "VERDICT-$NONCE: BREAKING") verdict=BREAKING ;;
          *) verdict=UNKNOWN ;;
        esac

        {
          echo "<!-- renovate-bc-check head=$HEAD verdict=$verdict -->"
          echo "## BC check: $verdict"
          echo
          head -c 60000 /tmp/review.md
        } > /tmp/comment.md
        gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

        for old in bc-safe bc-breaking bc-unknown; do
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$PR/labels/$old" > /dev/null 2>&1 || true
        done
        # The issues endpoint creates a label that does not exist yet; `gh pr edit --add-label` does not.
        gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/labels" \
          -f "labels[]=bc-$(tr '[:upper:]' '[:lower:]' <<< "$verdict")" > /dev/null

        echo "PR #$PR: $verdict"
        if [ "$verdict" = SAFE ]; then
          # GitHub refuses to arm auto-merge on a PR whose checks are already green; merge it outright then.
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash --auto \
            || gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --squash
        fi
