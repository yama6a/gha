name: YAML and workflow lint
description: Runs yamllint against the repo and actionlint against its workflow files.
runs:
  using: composite
  steps:
    - name: yamllint
      shell: bash
      # A repo keeps a local .yamllint.yml only to extend `ignore:`; everything else uses the canonical
      # config shipped here, so a rule change lands everywhere at once.
      env:
        FALLBACK_CONFIG: ${{ github.action_path }}/../../../.yamllint.yml
      run: |
        set -euo pipefail
        config=.yamllint.yml
        if [ ! -f "$config" ]; then config="$FALLBACK_CONFIG"; fi
        echo "yamllint config: $config"
        pipx run yamllint -c "$config" .

    - name: actionlint  # lints workflow files, and shellchecks their run: blocks
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RETRY_SH: ${{ github.action_path }}/../../../scripts/retry.sh
      run: |
        set -euo pipefail
        source "$RETRY_SH"
        tarball="actionlint_1.7.7_linux_$(dpkg --print-architecture).tar.gz"
        dir="$(mktemp -d)"
        retry_release_download rhysd/actionlint v1.7.7 "$dir" "$tarball"
        tar -xzf "$dir/$tarball" -C "$dir" actionlint
        # No actionlint release knows the copilot-requests scope yet; consumers grant it to renovate.yaml.
        # Its runner label list is hardcoded and lags GitHub by months, so runs-on labels go unchecked.
        "$dir/actionlint" -color \
          -ignore 'unknown permission scope "copilot-requests"' \
          -ignore 'label ".+" is unknown'
