name: YAML and workflow lint
description: Runs yamllint against the repo and actionlint against its workflow files.
runs:
  using: composite
  steps:
    - name: yamllint
      shell: bash
      # A repo keeps a local .yamllint.yml only to extend `ignore:`; everything else uses the canonical
      # config shipped here, so a rule change lands everywhere at once.
      env:
        FALLBACK_CONFIG: ${{ github.action_path }}/../../../.yamllint.yml
      run: |
        set -euo pipefail
        config=.yamllint.yml
        if [ ! -f "$config" ]; then config="$FALLBACK_CONFIG"; fi
        echo "yamllint config: $config"
        pipx run yamllint -c "$config" .

    - name: actionlint  # lints workflow files, and shellchecks their run: blocks
      shell: bash
      run: |
        curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_$(dpkg --print-architecture).tar.gz" \
          | tar xz actionlint
        ./actionlint -color
