name: Docker build and release (reusable)

on:
  workflow_call:
    inputs:
      dockerfile:
        type: string
        default: Dockerfile
      context:
        type: string
        default: .
      platforms:
        type: string
        default: linux/amd64,linux/arm64
      build-command:
        description: Shell command to run before the docker build, e.g. to produce a dist/ the Dockerfile only COPYs
        type: string
        default: ''
      version:
        description: Release version to use verbatim; empty computes the next integer from the latest release
        type: string
        default: ''
      build-args:
        description: Newline-separated KEY=VALUE pairs, passed straight to docker/build-push-action
        type: string
        default: ''
      create-release:
        description: Create the GitHub release here; false when the caller publishes more artifacts first and tags itself
        type: boolean
        default: true
    outputs:
      version:
        description: The release version that was built and pushed
        value: ${{ jobs.build-push.outputs.version }}

env:
  IMAGE: ghcr.io/${{ github.repository }}
  CI_TAG: ci-${{ github.run_id }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    # A reusable workflow's jobs can request only what the caller grants here.
    permissions:
      contents: write  # required to create the GitHub release
      packages: write  # required, or the image push fails with permission_denied
      id-token: write  # mints the OIDC token the attestation is signed with
      attestations: write  # stores the attestation
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # A reusable workflow cannot use a composite action out of the caller's checkout, so it
      # fetches its own repo at the ref the caller pinned.
      - name: Check out the shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gha
          sparse-checkout: |
            .github/actions/hadolint
            .hadolint.yaml
          sparse-checkout-cone-mode: false

      - uses: ./.gha/.github/actions/hadolint
        with:
          dockerfiles: ${{ inputs.dockerfile }}

      - name: Drop the shared actions checkout
        run: rm -rf .gha  # it would otherwise be part of the build context

      - name: Determine the release version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            latest=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // "0"')
            VERSION=$((latest + 1))
            echo "Latest release: ${latest:-<none>} -> next: $VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: inputs.build-command != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Restore the npm store
        if: inputs.build-command != ''
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-

      # Built here, not in the Dockerfile: the image only COPYs the build output, so this runs once on the
      # runner instead of once per target arch under emulation.
      - name: Run build command
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}

      # Same guard as the restore: its outputs are empty when it was skipped.
      - name: Save the npm store
        if: inputs.build-command != '' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # A two-platform QEMU build cannot --load a manifest list, so the scan runs against a pushed
      # temp tag and the release tag is a manifest copy of it afterwards.
      - name: Build and push the scan candidate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}  # a multi-platform value pushes a manifest list, one image per arch
          build-args: ${{ inputs.build-args }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE }}:${{ env.CI_TAG }}

      # Report-only until every repo has a week of output to review and a .trivyignore for whatever
      # it decides to carry; enforcing is then a one-line change to exit-code.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}  # trivy pulls the image itself, and a private repo's needs a login
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.CI_TAG }}
          format: table
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      # The ci-* tag is left in place on purpose: the release tag is a byte-identical copy with
      # the same digest, and GHCR deletes by digest, so removing the ci-* package version
      # would take the release tag with it.
      - name: Promote the scanned image to the release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: docker buildx imagetools create -t "${IMAGE}:${VERSION}" "${IMAGE}:${CI_TAG}"

      - name: Read the released digest
        id: released
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          digest=$(docker buildx imagetools inspect "${IMAGE}:${VERSION}" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Signed attestations exist for private repos only on Enterprise Cloud; on a
      # Pro plan the step fails there, so it runs for public repos only.
      - name: Attest the build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.released.outputs.digest }}
          push-to-registry: true

      # Only tag a release once the image has actually been pushed.
      - name: Create GitHub release
        if: inputs.create-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$VERSION" \
            --target "${{ github.sha }}" \
            --title "$VERSION" \
            --notes "Image: ${IMAGE}:${VERSION}"
