name: Docker build and release (reusable)

on:
  workflow_call:
    inputs:
      dockerfile:
        type: string
        default: Dockerfile
      context:
        type: string
        default: .
      platforms:
        type: string
        default: linux/amd64,linux/arm64
      build-command:
        description: Shell command to run before the docker build, e.g. to produce a dist/ the Dockerfile only COPYs
        type: string
        default: ''
      node-version:
        description: Node version to set up before build-command; empty skips node setup
        type: string
        default: ''
    outputs:
      version:
        description: The release version that was built and pushed
        value: ${{ jobs.build-push.outputs.version }}

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to create the GitHub release
      packages: write  # required, or the image push fails with permission_denied
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Determine next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // "0"')
          next=$((latest + 1))
          echo "Latest release: ${latest:-<none>} -> next: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        if: inputs.node-version != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      # Built here, not in the Dockerfile: the image only COPYs the build output, so this runs once on the
      # runner instead of once per target arch under emulation.
      - name: Run build command
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}  # a multi-platform value pushes a manifest list, one image per arch
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Only tag a release once the image has actually been pushed.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.version }}" \
            --target "${{ github.sha }}" \
            --title "${{ steps.version.outputs.version }}" \
            --notes "Image: ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}"
