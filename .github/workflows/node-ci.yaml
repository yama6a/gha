name: Node PR CI (reusable)

# The full check set every JS/TS repo runs: generate drift, lint, format, typecheck, test, audit,
# build. No toggles - a repo that has nothing to do for one of them defines the script as
# "exit 0", so the gap is visible in package.json instead of in the caller.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Where package.json lives, for a frontend that isn't at the repo root
        type: string
        default: .
      build-env:
        description: Newline-separated KEY=VALUE pairs, exported before the build step only
        type: string
        default: ''
      runner:
        type: string
        default: ubuntu-24.04-arm

jobs:
  check:
    # Required-check context: the steps grow, the name does not.
    name: node
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # No cache: here. The explicit cache below shares its key with playwright-e2e.yaml so both
      # hit one warmed entry; setup-node's built-in key is its own format and would miss it.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: ${{ inputs.working-directory }}/.nvmrc

      - name: Restore the npm store
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: npm ci

      # Never from a pull_request: that scope is readable by the one PR and nothing after it.
      - name: Save the npm store
        if: github.event_name != 'pull_request' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

      - name: Generate
        run: npm run generate

      # Generated API types are never rebuilt at build time, so a stale commit ships as-is.
      # Run from the repo root: codegen writes outside working-directory in a monorepo.
      - name: Check the generated output is committed
        working-directory: ${{ github.workspace }}
        run: |
          git diff --exit-code || {
            echo "::error::generated output is stale, run 'npm run generate' and commit the result"
            exit 1
          }

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Audit
        run: npm audit --audit-level=high

      - name: Set build env
        if: inputs.build-env != ''
        run: echo "${{ inputs.build-env }}" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build
