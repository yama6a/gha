name: Node PR CI (reusable)

# Lint, typecheck, test, audit, build: the checks every JS/TS repo should run, so a new repo
# never quietly ships without them. Enabled by default; disable the ones that don't apply
# (e.g. a plain-JS static site sets typecheck: false, a repo with no tests sets test: false).
# Anything repo-specific (e2e, translation checks, raw-color lint, ...) stays a local job.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: '24'
      package-manager:
        description: npm or pnpm
        type: string
        default: npm
      working-directory:
        description: Where package.json lives, for a frontend that isn't at the repo root
        type: string
        default: .
      pre-check:
        description: >-
          Shell command run once, after install and before lint/typecheck/test, at the repo
          root regardless of working-directory. For monorepo codegen a check depends on (e.g.
          regenerating API types from a sibling Go service) - relies on whatever toolchain the
          runner or a prior step already provides, this does not set one up.
        type: string
        default: ''
      lint:
        type: boolean
        default: true
      typecheck:
        type: boolean
        default: true
      test:
        type: boolean
        default: true
      audit:
        type: boolean
        default: true
      audit-level:
        type: string
        default: high
      build:
        type: boolean
        default: true
      build-env:
        description: Newline-separated KEY=VALUE pairs, exported before the build step only
        type: string
        default: ''

jobs:
  ci:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up pnpm
        if: inputs.package-manager == 'pnpm'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - name: Determine lockfile path
        id: lockfile
        run: |
          dir="${{ inputs.working-directory }}"
          [ "$dir" = "." ] && dir=""
          [ -n "$dir" ] && dir="${dir}/"
          if [ "${{ inputs.package-manager }}" = pnpm ]; then
            echo "path=${dir}pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          else
            echo "path=${dir}package-lock.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.package-manager }}
          cache-dependency-path: ${{ steps.lockfile.outputs.path }}

      - name: Install dependencies
        working-directory: ${{ inputs.working-directory }}
        run: |
          if [ "${{ inputs.package-manager }}" = pnpm ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Pre-check
        if: inputs.pre-check != ''
        run: ${{ inputs.pre-check }}

      - name: Lint
        if: inputs.lint
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.package-manager }} run lint

      - name: Typecheck
        if: inputs.typecheck
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.package-manager }} run typecheck

      - name: Test
        if: inputs.test
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.package-manager }} run test

      - name: Audit
        if: inputs.audit
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.package-manager }} audit --audit-level=${{ inputs.audit-level }}

      - name: Set build env
        if: inputs.build && inputs.build-env != ''
        run: echo "${{ inputs.build-env }}" >> "$GITHUB_ENV"

      - name: Build
        if: inputs.build
        working-directory: ${{ inputs.working-directory }}
        run: ${{ inputs.package-manager }} run build
