name: Docker build and release, native multi-arch (reusable)

# For a build that cannot run under QEMU (e.g. `next build`, which SIGILLs part-way through
# static generation on an emulated arch). Each platform builds on its own native runner and
# pushes an untagged image by digest; merge then joins them into one manifest-list tag. See
# docker-build-release.yaml for the single-runner, buildx-emulated equivalent.

on:
  workflow_call:
    inputs:
      dockerfile:
        type: string
        default: Dockerfile
      context:
        type: string
        default: .
      build-args:
        description: Newline-separated KEY=VALUE pairs, passed straight to docker/build-push-action
        type: string
        default: ''
      platforms:
        description: JSON array of {platform, runner}, one native runner per architecture
        type: string
        default: '[{"platform":"linux/amd64","runner":"ubuntu-latest"},{"platform":"linux/arm64","runner":"ubuntu-24.04-arm"}]'
    outputs:
      version:
        description: The release version that was built and pushed
        value: ${{ jobs.version.outputs.version }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Resolved once, so every architecture publishes under the same tag.
  version:
    runs-on: ubuntu-24.04-arm
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Determine next version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          latest=$(gh release list --repo "$REPO" --limit 1 --json tagName --jq '.[0].tagName // "0"')
          next=$((latest + 1))
          echo "Latest release: ${latest:-<none>} -> next: $next"
          echo "version=$next" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(inputs.platforms) }}
    runs-on: ${{ matrix.runner }}
    # A reusable workflow's jobs can request only what the caller grants here.
    permissions:
      contents: read  # actions/checkout cannot read a private repo without it
      packages: write  # required to push by digest, or the image push fails with permission_denied
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Derive a filename-safe platform tag
        run: echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
        env:
          platform: ${{ matrix.platform }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ inputs.build-args }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # Per-platform scope: one shared cache would have the two legs evicting each other.
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: digest-${{ env.PLATFORM_PAIR }}  # artifact names must be unique across the matrix
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the per-arch digests into one manifest list, which is what a multi-arch tag actually is.
  merge:
    needs: [version, build]
    runs-on: ubuntu-24.04-arm
    # A reusable workflow's jobs can request only what the caller grants here.
    permissions:
      contents: write  # required to create the GitHub release
      packages: write  # required to push the manifest list
    steps:
      - name: Download the digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Create the manifest list
        working-directory: /tmp/digests
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          refs=()
          for digest in *; do refs+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create -t "${IMAGE}:${VERSION}" "${refs[@]}"

      - name: Verify every platform is present
        env:
          VERSION: ${{ needs.version.outputs.version }}
          WANT: ${{ inputs.platforms }}
        run: |
          docker buildx imagetools inspect "${IMAGE}:${VERSION}" --raw \
            | jq -r '.manifests[].platform | "\(.os)/\(.architecture)"' | sort -u > /tmp/have
          jq -r '.[].platform' <<<"$WANT" | while read -r p; do
            grep -qx "$p" /tmp/have || { echo "::error::${p} missing from the manifest"; exit 1; }
          done

      # Only tag a release once the manifest exists and covers every platform.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$VERSION" --repo "$REPO" --target "${{ github.sha }}" --title "$VERSION" \
            --notes "Image: ${IMAGE}:${VERSION}"
