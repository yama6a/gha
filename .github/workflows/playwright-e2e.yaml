name: Playwright E2E (reusable)

# Builds the app once, then runs the Playwright suite sharded across parallel runners. Called a
# second way with warm-cache: true from a push workflow on the default branch, which populates the
# npm and browser caches that PRs restore from.

on:
  workflow_call:
    inputs:
      shard-total:
        type: number
        default: 4
      runner:
        description: Must match the warm-cache caller, the cache key includes runner.arch
        type: string
        default: ubuntu-24.04-arm
      working-directory:
        description: Where package.json lives, for a frontend that isn't at the repo root
        type: string
        default: .
      build-env:
        description: Newline-separated KEY=VALUE pairs, exported before the build step only
        type: string
        default: ''
      build-artifact-paths:
        description: >-
          upload-artifact paths for the build output, relative to the repo root. The first line
          that is not an exclusion is where the shards download it back to.
        type: string
        default: |
          .next
          !.next/cache
          !.next/standalone
      browser:
        type: string
        default: chromium
      warm-cache:
        description: Run only the cache-warming job, skip the suite
        type: boolean
        default: false

jobs:
  shards:
    if: ${{ !inputs.warm-cache }}
    name: shard list
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      # A matrix cannot range over a number, it needs the literal list.
      - name: List the shards
        id: list
        run: echo "matrix=[$(seq -s, 1 ${{ inputs.shard-total }})]" >> "$GITHUB_OUTPUT"

  build:
    if: ${{ !inputs.warm-cache }}
    name: e2e build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: ${{ inputs.working-directory }}/.nvmrc

      - name: Cache the npm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: npm ci

      - name: Set build env
        if: inputs.build-env != ''
        run: echo "${{ inputs.build-env }}" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Upload the build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: e2e-build
          # .next is a dotfile, the artifact lands empty without this.
          include-hidden-files: true
          path: ${{ inputs.build-artifact-paths }}
          retention-days: 1

  test:
    needs: [shards, build]
    name: e2e shard ${{ matrix.shard }}/${{ inputs.shard-total }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.shards.outputs.matrix) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: ${{ inputs.working-directory }}/.nvmrc

      - name: Cache the npm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: npm ci

      - name: Resolve the build output path
        id: output
        run: |
          printf '%s\n' "${{ inputs.build-artifact-paths }}" \
            | awk '$1 != "" && $1 !~ /^!/ {print "path=" $1; exit}' >> "$GITHUB_OUTPUT"

      - name: Download the build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: e2e-build
          path: ${{ steps.output.outputs.path }}

      # The browser build depends only on @playwright/test. Keying on the lockfile missed on every
      # Renovate PR even when Playwright had not moved.
      - name: Resolve the Playwright version
        id: pw-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # No restore-keys: a partial match hands you the wrong browser build.
          key: pw-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw-version.outputs.version }}

      - name: Install the Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install ${{ inputs.browser }} --with-deps

      - name: Install the Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ inputs.browser }}

      - name: Run the suite
        run: npx playwright test --shard=${{ matrix.shard }}/${{ inputs.shard-total }}

      # A timeout-minutes kill reports as cancelled, not failed, so failure() alone would skip this
      # exactly when a shard hangs.
      - name: Dump state if the run hung
        if: failure() || cancelled()
        run: |
          echo "--- longest-running processes ---"
          ps -eo pid,etime,pcpu,rss,comm --sort=-etime | head -25
          echo "--- listening sockets ---"
          ss -ltnp || true

      - name: Upload the report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure() || cancelled()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: ${{ inputs.working-directory }}/playwright-report/
          retention-days: 7

  gate:
    # Branch protection pins this one stable context, so changing shard-total cannot strand a
    # required check that never reports.
    name: e2e
    if: ${{ always() && !inputs.warm-cache }}
    needs: test
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Fail unless every shard succeeded
        run: |
          echo "shards: ${{ needs.test.result }}"
          [ "${{ needs.test.result }}" = success ]

  warm:
    if: ${{ inputs.warm-cache }}
    name: warm the caches
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: ${{ inputs.working-directory }}/.nvmrc

      - name: Cache the npm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: npm ci

      - name: Resolve the Playwright version
        id: pw-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browsers
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw-version.outputs.version }}

      - name: Download the browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install ${{ inputs.browser }}
