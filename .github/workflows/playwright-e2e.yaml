name: Playwright E2E (reusable)

# Runs the Playwright suite sharded across parallel runners, against the build that node-ci.yaml
# uploaded earlier in the same run as artifact node-build. Called a second way with warm-cache: true
# from a push workflow on the default branch, which populates the npm and browser caches that PRs
# restore from.

on:
  workflow_call:
    inputs:
      shards:
        description: JSON array of shard numbers, one matrix job each
        type: string
        default: '[1, 2]'
      runner:
        description: Must match the warm-cache caller, the cache key includes runner.arch
        type: string
        default: ubuntu-24.04-arm
      working-directory:
        description: Where package.json lives, for a frontend that isn't at the repo root
        type: string
        default: .
      build-artifact-paths:
        description: >-
          The upload-build paths the caller gave node-ci.yaml, relative to the repo root. The first
          line that is not an exclusion is where the shards download the build to.
        type: string
        default: |
          .next
          !.next/cache
          !.next/standalone
      browser:
        type: string
        default: chromium
      warm-cache:
        description: Run only the cache-warming job, skip the suite
        type: boolean
        default: false

jobs:
  test:
    if: ${{ !inputs.warm-cache }}
    name: e2e shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(inputs.shards) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: ${{ inputs.working-directory }}/.nvmrc

      # Restore only: a shard never saves, four of them uploading the same key was pure overhead.
      - name: Restore the npm store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: npm ci

      - name: Resolve the build output path
        id: output
        env:
          ARTIFACT_PATHS: ${{ inputs.build-artifact-paths }}
        run: |
          printf '%s\n' "$ARTIFACT_PATHS" \
            | awk '$1 != "" && $1 !~ /^!/ {print "path=" $1; exit}' >> "$GITHUB_OUTPUT"

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: node-build
          path: ${{ steps.output.outputs.path }}

      # The browser build depends only on @playwright/test. Keying on the lockfile missed on every
      # Renovate PR even when Playwright had not moved.
      - name: Resolve the Playwright version
        id: pw-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browsers
        id: pw-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          # No restore-keys: a partial match hands you the wrong browser build.
          key: pw-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw-version.outputs.version }}

      - name: Install the Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        env:
          BROWSER: ${{ inputs.browser }}
        run: npx playwright install "$BROWSER" --with-deps

      - name: Install the Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        env:
          BROWSER: ${{ inputs.browser }}
        run: npx playwright install-deps "$BROWSER"

      - name: Run the suite
        env:
          SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: npx playwright test --shard="$SHARD"

      # A timeout-minutes kill reports as cancelled, not failed, so failure() alone would skip this
      # exactly when a shard hangs.
      - name: Dump state if the run hung
        if: failure() || cancelled()
        run: |
          echo "--- longest-running processes ---"
          ps -eo pid,etime,pcpu,rss,comm --sort=-etime | head -25
          echo "--- listening sockets ---"
          ss -ltnp || true

      - name: Upload the report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: failure() || cancelled()
        with:
          name: playwright-report-${{ matrix.shard }}
          path: ${{ inputs.working-directory }}/playwright-report/
          retention-days: 7

  gate:
    # Branch protection pins this one stable context, so changing shards cannot strand a
    # required check that never reports.
    name: e2e
    if: ${{ always() && !inputs.warm-cache }}
    needs: test
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Fail unless every shard succeeded
        run: |
          echo "shards: ${{ needs.test.result }}"
          [ "${{ needs.test.result }}" = success ]

  warm:
    if: ${{ inputs.warm-cache }}
    name: warm the caches
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: ${{ inputs.working-directory }}/.nvmrc

      - name: Restore the npm store
        id: npm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
          restore-keys: |
            npm-${{ runner.os }}-${{ runner.arch }}-

      - name: Install dependencies
        run: npm ci

      # Never from a pull_request: that scope is readable by the one PR and nothing after it.
      - name: Save the npm store
        if: github.event_name != 'pull_request' && steps.npm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.npm
          key: ${{ steps.npm-cache.outputs.cache-primary-key }}

      - name: Resolve the Playwright version
        id: pw-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browsers
        id: pw-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw-version.outputs.version }}

      - name: Download the browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        env:
          BROWSER: ${{ inputs.browser }}
        run: npx playwright install "$BROWSER"

      - name: Save the Playwright browsers
        if: github.event_name != 'pull_request' && steps.pw-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw-cache.outputs.cache-primary-key }}
