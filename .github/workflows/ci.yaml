name: ci

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  yaml:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/yaml-checks

  renovate-presets:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # A broken preset here silently falls every consuming repo back to Renovate's defaults.
      - uses: ./.github/actions/validate-renovate-config
        with:
          config-file: default.json5 go.json5 node.json5

  # The only composite action here whose shell branches. Three repos adopt it on the same v1
  # move, so a wrong arg build would break all three at once.
  kubeconform:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/kubeconform
        with:
          paths: .github/testdata/kubeconform/valid.yaml

      - name: -strict survived the arg building
        run: |
          set -uo pipefail
          # shellcheck disable=SC2086
          if kubeconform $KUBECONFORM_ARGS .github/testdata/kubeconform/invalid.yaml; then
            echo "::error::kubeconform accepted a manifest that -strict must reject"
            exit 1
          fi

      # No paths: installs and exports the flags, runs nothing, which is the stdin call shape.
      - uses: ./.github/actions/kubeconform
        with:
          crd-catalog: 'false'

      - name: install-only exports usable args
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          kubeconform $KUBECONFORM_ARGS < .github/testdata/kubeconform/valid.yaml

  helm-chart-checks:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/helm-chart-checks
        with:
          charts: .github/testdata/helm/smoke

      - uses: ./.github/actions/helm-chart-checks
        with:
          charts: .github/testdata/helm/smoke
          schema: check
          docs: check

      - id: broken
        continue-on-error: true
        uses: ./.github/actions/helm-chart-checks
        with:
          charts: .github/testdata/helm/broken

      - name: the broken chart must fail the action
        env:
          OUTCOME: ${{ steps.broken.outcome }}
        run: |
          set -euo pipefail
          if [ "$OUTCOME" != failure ]; then
            echo "::error::helm-chart-checks accepted a chart whose Deployment has a string replicas"
            exit 1
          fi

  # Both binaries are pinned rather than taken from the runner image, so the fixtures also have
  # to prove the pinned ones are what ran.
  shell-checks:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/shell-checks
        with:
          paths: .github/testdata/shell/clean.sh

      - name: the pinned shellcheck is the one on PATH
        run: |
          shellcheck --version | grep -qx 'version: 0.10.0'

      - name: an unformatted script fails shfmt
        run: |
          set -uo pipefail
          if shfmt -d -i 2 -ci -bn -sr .github/testdata/shell/unformatted.sh; then
            echo "::error::shfmt accepted a script it has to reformat"
            exit 1
          fi

      - name: an unquoted expansion fails shellcheck
        run: |
          set -uo pipefail
          if shellcheck .github/testdata/shell/unquoted.sh; then
            echo "::error::shellcheck accepted an unquoted expansion"
            exit 1
          fi

  hadolint:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Dockerfile.unpinned-apt is the ignore list earning its keep: DL3008 would otherwise fail it.
      - uses: ./.github/actions/hadolint
        with:
          dockerfiles: .github/testdata/hadolint/Dockerfile.clean .github/testdata/hadolint/Dockerfile.unpinned-apt

      - name: a piped shell install still fails
        run: |
          set -uo pipefail
          if hadolint --config .hadolint.yaml .github/testdata/hadolint/Dockerfile.bad; then
            echo "::error::hadolint accepted the DL3003 and DL4006 fixture"
            exit 1
          fi
