name: Docker build check (reusable)

on:
  workflow_call:
    inputs:
      dockerfile:
        type: string
        default: Dockerfile
      context:
        type: string
        default: .
      platforms:
        type: string
        default: linux/amd64,linux/arm64
      build-args:
        description: Newline-separated KEY=VALUE pairs, passed straight to docker/build-push-action
        type: string
        default: ''
      smoke-test:
        description: Shell command run after the build; $IMAGE names the image built for the runner's platform
        type: string
        default: ''

jobs:
  docker:
    name: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # A reusable workflow cannot use a composite action out of the caller's checkout, so it
      # fetches its own repo at the ref the caller pinned.
      - name: Check out the shared actions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gha
          sparse-checkout: |
            .github/actions/hadolint
            .hadolint.yaml
          sparse-checkout-cone-mode: false

      - uses: ./.gha/.github/actions/hadolint
        with:
          dockerfiles: ${{ inputs.dockerfile }}

      - name: Drop the shared actions checkout
        run: rm -rf .gha  # it would otherwise be part of the build context

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build for every platform
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          build-args: ${{ inputs.build-args }}
          push: false

      # A multi-platform build cannot --load, so the smoke test gets a second build for the
      # runner's platform. It reuses the layers of the build above.
      - name: Load the image for the runner's platform
        if: inputs.smoke-test != ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          load: true
          tags: smoke-test:${{ github.run_id }}

      - name: Smoke test
        if: inputs.smoke-test != ''
        env:
          IMAGE: smoke-test:${{ github.run_id }}
        run: ${{ inputs.smoke-test }}
