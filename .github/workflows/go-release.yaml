# Semver release for a Go library: one tag and one GitHub release per merge to main. The bump
# comes from the merged PR's labels; a merge with no PR (a direct push) is a patch.
name: Go release (reusable)

on:
  workflow_call:
    inputs:
      initial-version:
        description: Tag to create when the repo has no v* tag yet
        type: string
        default: v0.1.0
    outputs:
      version:
        description: The tag that was created, empty when HEAD was already tagged
        value: ${{ jobs.release.outputs.version }}

jobs:
  release:
    name: go-release
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: write  # push the tag and create the release
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the tag list is the version history

      - name: Pick the next version
        id: next
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INITIAL: ${{ inputs.initial-version }}
        run: |
          set -euo pipefail
          if [ -n "$(git tag --points-at HEAD -l 'v*')" ]; then
            echo "HEAD is already tagged: $(git tag --points-at HEAD -l 'v*' | tr '\n' ' ')"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$latest" ]; then
            echo "no v* tag yet -> $INITIAL"
            echo "version=$INITIAL" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          labels=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[].labels[].name' || true)
          IFS=. read -r major minor patch <<< "${latest#v}"
          if grep -qx 'release:major' <<< "$labels"; then
            major=$((major + 1)); minor=0; patch=0
          elif grep -qx 'release:minor' <<< "$labels"; then
            minor=$((minor + 1)); patch=0
          else
            patch=$((patch + 1))
          fi
          version="v$major.$minor.$patch"
          echo "$latest -> $version (labels: $(tr '\n' ' ' <<< "$labels"))"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Tag and release
        if: steps.next.outputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --generate-notes
