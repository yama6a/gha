name: Image scan (reusable)

# Scans released images apart from the build. A new CVE fails this run and alerts, but never blocks
# a deploy. The caller starts it with workflow_run once its build workflow has passed.

on:
  workflow_call:
    inputs:
      tags:
        description: Space- or newline-separated tags of ghcr.io/<caller repo>; each tag and platform gets one scan job
        type: string
        default: latest
      skip-dirs:
        description: Comma-separated image paths the scanner skips entirely, for directories whose contents are already public
        type: string
        default: ''

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The platforms come from each tag's manifest list, so a caller never lists them a second time.
  targets:
    runs-on: ubuntu-26.04-arm
    # A reusable workflow's jobs can request only what the caller grants here.
    permissions:
      packages: read  # reads the manifest list of a private image
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # Attestation manifests carry the platform unknown/unknown and are left out.
      - name: List every tag and platform
        id: list
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          set -euo pipefail
          entries=()
          for tag in $TAGS; do
            platforms=$(docker buildx imagetools inspect "${IMAGE}:${tag}" --raw \
              | jq -r '.manifests[]?.platform | select(. != null and .os != "unknown") | "\(.os)/\(.architecture)"' \
              | sort -u)
            if [ -z "$platforms" ]; then
              echo "::error::${IMAGE}:${tag} is not a manifest list with a platform"
              exit 1
            fi
            for platform in $platforms; do
              entries+=("$(jq -nc --arg tag "$tag" --arg platform "$platform" '{tag: $tag, platform: $platform}')")
            done
          done
          echo "matrix=$(printf '%s\n' "${entries[@]}" | jq -sc .)" >> "$GITHUB_OUTPUT"

  scan:
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.targets.outputs.matrix) }}
    name: scan (${{ matrix.tag }}, ${{ matrix.platform }})
    runs-on: ubuntu-26.04-arm
    # A reusable workflow's jobs can request only what the caller grants here.
    permissions:
      contents: read  # actions/checkout cannot read a private repo without it
      packages: read  # Trivy pulls a private image
    steps:
      # Trivy reads the caller's .trivyignore from the working directory.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # A reusable workflow cannot use a composite action out of the caller's checkout, so it
      # fetches its own repo at the ref the caller pinned.
      - name: Check out the shared scan action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gha
          sparse-checkout: |
            .github/actions/trivy-scan
            scripts/retry.sh
          sparse-checkout-cone-mode: false

      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan the image
        # Trivy pulls a private image with the ghcr.io login above. It reads that login from the
        # Docker config for ghcr.io only, so the token never reaches its DB mirrors.
        uses: ./.gha/.github/actions/trivy-scan
        env:
          # Trivy picks linux/amd64 out of a manifest list unless told otherwise.
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ env.IMAGE }}:${{ matrix.tag }}
          skip-dirs: ${{ inputs.skip-dirs }}
