name: Go PR CI (reusable)

on:
  workflow_call:

jobs:
  check:
    name: go  # a required-check context; the steps grow, this does not
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30  # the cache trim below assumes the run finishes well inside 90 minutes
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        id: go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false  # its key has no restore-keys, so any go.mod change was a cold start

      # ISO week in the key, so a repo whose go.sum never changes still refreshes GOCACHE weekly.
      - name: Compute the cache week
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # Literal paths: actions/cache runs no shell, and nothing in this job moves GOPATH or GOCACHE.
      - name: Restore the Go caches
        id: gocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-v1-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}-${{ steps.week.outputs.week }}
          # Bump go-v1 to drop the old module versions a prefix match keeps carrying forward.
          restore-keys: |
            go-v1-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}-
            go-v1-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
            go-v1-${{ runner.arch }}-

      # A stale go.mod/go.sum still builds, so nothing else here would catch it.
      # Runs before go generate, which can edit go.mod through `go run -mod=mod`.
      - name: go mod tidy is committed
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum \
            || { echo "::error::go.mod/go.sum are not tidy; run 'make tidy' and commit"; exit 1; }

      # Generated code is never rebuilt at build time, so a stale committed copy
      # compiles green and ships the wrong contract. The diff covers the whole
      # tree, not just the generated files, to catch a generator that edits go.mod.
      - name: go generate output is committed
        run: |
          set -euo pipefail
          go generate ./...
          git diff --exit-code \
            || { echo "::error::generated code is stale; run 'make generate' and commit"; exit 1; }
          untracked="$(git status --porcelain --untracked-files=all)"
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "::error::go generate produced new files; run 'make generate' and commit"
            exit 1
          fi

      # job.workflow_sha is this reusable workflow's own commit, so a caller pinned
      # to @v2 gets the v2 config and never main's.
      - name: Fetch the canonical config and scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gha
          sparse-checkout: |
            .golangci.yaml
            scripts/govulncheck.sh
          sparse-checkout-cone-mode: false  # cone mode selects directories, not single files

      # `*+` appends arrays, so .golangci.local.yaml lists only its additions. .gha goes away
      # here so the cross-compile and any later git diff never see it.
      - name: Stage the lint config and scripts
        run: |
          set -euo pipefail
          if [ -f .golangci.yaml ] || [ -f .golangci.yml ]; then
            echo "::error::delete this repo's .golangci.yaml; yama6a/gha holds the only one. Repo-specific additions go in .golangci.local.yaml"
            exit 1
          fi
          if [ -f .golangci.local.yaml ]; then
            # shellcheck disable=SC2016  # the yq expression is not shell
            yq eval-all '. as $item ireduce ({}; . *+ $item)' \
              .gha/.golangci.yaml .golangci.local.yaml > /tmp/golangci.yaml
          else
            cp .gha/.golangci.yaml /tmp/golangci.yaml
          fi
          install -m 0755 .gha/scripts/govulncheck.sh /tmp/govulncheck.sh
          rm -rf .gha

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          args: --timeout 5m -c /tmp/golangci.yaml ./...
          skip-save-cache: ${{ github.event_name == 'pull_request' }}  # a PR-scoped save is readable by that PR alone

      # `run` does not enforce the formatters, so check them separately. Without
      # -c this only runs gofmt, and gofumpt and goimports go unchecked.
      # golangci-lint-action put the binary on PATH.
      - name: Check formatting
        run: golangci-lint fmt --diff -c /tmp/golangci.yaml

      - name: Run go vet
        run: go vet ./...

      # The restore step brings back GOCACHE, so without -count=1 go test serves cached results.
      # The race runtime sleeps 1s at exit of every test binary to catch races in goroutines
      # still running; with 60 packages that is a minute of CI, so it is off here.
      - name: Run go test
        env:
          GORACE: atexit_sleep_ms=0
        run: go test ./... -race -count=1 -coverprofile=cover.out

      - name: Coverage summary
        run: go tool cover -func=cover.out | tail -1

      # Wrapped rather than called directly so a repo can allowlist an OSV id in
      # .govulncheck-ignore; the script explains when that is the only way out.
      - name: Run govulncheck
        run: /tmp/govulncheck.sh

      # Every Go repo here ships a multi-arch image, and CI runs on one arch, so a
      # compile error on the other would first surface at release time.
      - name: Cross-compile
        run: |
          set -euo pipefail
          pids=()
          for target in linux/amd64 linux/arm64; do
            CGO_ENABLED=0 GOOS="${target%%/*}" GOARCH="${target##*/}" go build ./... > "/tmp/build-${target##*/}.log" 2>&1 &
            pids+=("$!")
          done
          rc=0
          i=0
          for target in linux/amd64 linux/arm64; do
            echo "::group::build $target"
            wait "${pids[$i]}" || rc=1
            cat "/tmp/build-${target##*/}.log"
            echo "::endgroup::"
            i=$((i + 1))
          done
          exit "$rc"

      # Go bumps an entry's mtime on use, so this keeps only what this run touched.
      - name: Trim the Go build cache to what this run used
        if: github.event_name != 'pull_request' && steps.gocache.outputs.cache-hit != 'true'
        run: find "$(go env GOCACHE)" -type f -mmin +90 -delete

      # Never from a pull_request: that scope is readable by the one PR and nothing after it.
      - name: Save the Go caches
        if: github.event_name != 'pull_request' && steps.gocache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.gocache.outputs.cache-primary-key }}
