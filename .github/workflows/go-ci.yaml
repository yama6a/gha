name: Go PR CI (reusable)

on:
  workflow_call:
    inputs:
      mode:
        description: check runs every check, race runs only the race tests, warm-cache fills the caches PRs read
        type: string
        default: check
      race:
        description: Use the race detector in the check mode's tests and the warm-cache mode's test builds
        type: boolean
        default: true

jobs:
  check:
    name: go  # a required-check context in every mode; the steps grow, this does not
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30  # the cache trim below assumes the run finishes well inside 90 minutes
    steps:
      # Most later steps test the mode, so a misspelt one would skip them and pass green.
      - name: Check the mode
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in
            check | race | warm-cache) ;;
            *) echo "::error::mode must be check, race or warm-cache, not '$MODE'"; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        id: go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: go.mod
          cache: false  # its key has no restore-keys, so any go.mod change was a cold start

      # Literal paths: actions/cache runs no shell, and nothing in this job moves GOPATH or GOCACHE.
      - name: Restore the Go caches
        id: gocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          # docker-build-release.yaml restores the same paths and keys read-only. Change both files together.
          key: go-v1-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-${{ hashFiles('**/go.sum') }}
          # Bump go-v1 to drop the old module versions a prefix match keeps carrying forward.
          restore-keys: |
            go-v1-${{ runner.arch }}-${{ steps.go.outputs.go-version }}-
            go-v1-${{ runner.arch }}-

      # A stale go.mod/go.sum still builds, so nothing else here would catch it.
      # Runs before go generate, which can edit go.mod through `go run -mod=mod`.
      - name: go mod tidy is committed
        if: inputs.mode == 'check'
        run: |
          set -euo pipefail
          go mod tidy
          git diff --exit-code -- go.mod go.sum \
            || { echo "::error::go.mod/go.sum are not tidy; run 'make tidy' and commit"; exit 1; }

      # Generated code is never rebuilt at build time, so a stale committed copy
      # compiles green and ships the wrong contract. The diff covers the whole
      # tree, not just the generated files, to catch a generator that edits go.mod.
      - name: go generate output is committed
        if: inputs.mode == 'check'
        run: |
          set -euo pipefail
          go generate ./...
          git diff --exit-code \
            || { echo "::error::generated code is stale; run 'make generate' and commit"; exit 1; }
          untracked="$(git status --porcelain --untracked-files=all)"
          if [ -n "$untracked" ]; then
            echo "$untracked"
            echo "::error::go generate produced new files; run 'make generate' and commit"
            exit 1
          fi

      # job.workflow_sha is this reusable workflow's own commit, so a caller pinned
      # to @v2 gets the v2 config and never main's.
      - name: Fetch the canonical config and scripts
        if: inputs.mode != 'race'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gha
          sparse-checkout: |
            .golangci.yaml
            .github/actions/workflow-security
            .github/actions/validate-renovate-config
            scripts/govulncheck.sh
            scripts/retry.sh
          sparse-checkout-cone-mode: false  # cone mode selects directories, not single files

      - name: Check workflow security
        if: inputs.mode == 'check'
        uses: ./.gha/.github/actions/workflow-security

      - name: Validate the Renovate config
        if: inputs.mode == 'check'
        uses: ./.gha/.github/actions/validate-renovate-config

      # Installed here with the job token rather than by golangci-lint-action, which downloads from
      # GitHub without one.
      - name: Install golangci-lint
        if: inputs.mode != 'race'
        env:
          GH_TOKEN: ${{ github.token }}
          GOLANGCI_LINT_VERSION: v2.15.0  # renovate.json5 bumps this
        run: |
          set -euo pipefail
          source .gha/scripts/retry.sh
          name="golangci-lint-${GOLANGCI_LINT_VERSION#v}-linux-$(dpkg --print-architecture)"
          dir="$(mktemp -d)"
          retry_release_download golangci/golangci-lint "$GOLANGCI_LINT_VERSION" "$dir" "$name.tar.gz"
          tar -xzf "$dir/$name.tar.gz" -C "$dir" "$name/golangci-lint"
          sudo mv "$dir/$name/golangci-lint" /usr/local/bin/
          golangci-lint --version

      # `*+` appends arrays, so .golangci.local.yaml lists only its additions. .gha stays to the
      # job end: the runner reads validate-renovate-config's action.yaml again for its post step.
      # Go tools skip dot folders in ./..., so lint, vet, tests and the cross-compile never see it.
      - name: Stage the lint config and scripts
        if: inputs.mode != 'race'
        run: |
          set -euo pipefail
          if [ -f .golangci.yaml ] || [ -f .golangci.yml ]; then
            echo "::error::delete this repo's .golangci.yaml; yama6a/gha holds the only one. Repo-specific additions go in .golangci.local.yaml"
            exit 1
          fi
          if [ -f .golangci.local.yaml ]; then
            # shellcheck disable=SC2016  # the yq expression is not shell
            yq eval-all '. as $item ireduce ({}; . *+ $item)' \
              .gha/.golangci.yaml .golangci.local.yaml > /tmp/golangci.yaml
          else
            cp .gha/.golangci.yaml /tmp/golangci.yaml
          fi
          install -m 0755 .gha/scripts/govulncheck.sh /tmp/govulncheck.sh

      # Its cache key changes every 7 days, so warm-cache runs it even when the Go cache key exists.
      - name: Run golangci-lint
        if: inputs.mode != 'race'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          install-mode: none
          args: --timeout 5m -c /tmp/golangci.yaml ./...
          skip-save-cache: ${{ github.event_name == 'pull_request' }}  # a PR-scoped save is readable by that PR alone

      # `run` does not enforce the formatters, so check them separately. Without
      # -c this only runs gofmt, and gofumpt and goimports go unchecked.
      - name: Check formatting
        if: inputs.mode == 'check'
        run: golangci-lint fmt --diff -c /tmp/golangci.yaml

      - name: Run go vet
        if: inputs.mode == 'check'
        run: go vet ./...

      # The restore step brings back GOCACHE, so without -count=1 go test serves cached results.
      # The race runtime sleeps 1s at exit of every test binary to catch races in goroutines
      # still running; with 60 packages that is a minute of CI, so it is off here.
      - name: Run go test
        if: inputs.mode != 'warm-cache'
        env:
          GORACE: atexit_sleep_ms=0
          MODE: ${{ inputs.mode }}
          RACE: ${{ inputs.race }}
        run: |
          set -euo pipefail
          if [ "$MODE" = race ]; then
            go test ./... -race -count=1
          elif [ "$RACE" = true ]; then
            go test ./... -race -count=1 -coverprofile=cover.out
          else
            go test ./... -count=1 -coverprofile=cover.out
          fi

      - name: Coverage summary
        if: inputs.mode == 'check'
        run: go tool cover -func=cover.out | tail -1

      # Wrapped rather than called directly so a repo can allowlist an OSV id in
      # .govulncheck-ignore; the script explains when that is the only way out.
      - name: Run govulncheck
        if: inputs.mode == 'check'
        run: /tmp/govulncheck.sh

      - name: Download the modules
        if: inputs.mode == 'warm-cache' && steps.gocache.outputs.cache-hit != 'true'
        run: go mod download

      - name: Build
        if: inputs.mode == 'warm-cache' && steps.gocache.outputs.cache-hit != 'true'
        run: go build ./...

      # -c compiles without running anything. -run '^$' would still run a TestMain. The flags match
      # the check mode's tests for the same race input, so PR runs hit these entries. /dev/null,
      # because two packages of one name cannot both write into an -o directory.
      - name: Build the test binaries
        if: inputs.mode == 'warm-cache' && steps.gocache.outputs.cache-hit != 'true'
        env:
          RACE: ${{ inputs.race }}
        run: |
          set -euo pipefail
          if [ "$RACE" = true ]; then
            go test -c -race -cover -o /dev/null ./...
          else
            go test -c -cover -o /dev/null ./...
          fi

      # Every Go repo here ships a multi-arch image, and CI runs on one arch, so a
      # compile error on the other would first surface at release time. The flags equal the
      # release build's in docker-build-release.yaml, so it reads these cache entries.
      - name: Cross-compile
        if: inputs.mode == 'check' || (inputs.mode == 'warm-cache' && steps.gocache.outputs.cache-hit != 'true')
        run: |
          set -euo pipefail
          pids=()
          for target in linux/amd64 linux/arm64; do
            CGO_ENABLED=0 GOOS="${target%%/*}" GOARCH="${target##*/}" go build -trimpath ./... > "/tmp/build-${target##*/}.log" 2>&1 &
            pids+=("$!")
          done
          rc=0
          i=0
          for target in linux/amd64 linux/arm64; do
            echo "::group::build $target"
            wait "${pids[$i]}" || rc=1
            cat "/tmp/build-${target##*/}.log"
            echo "::endgroup::"
            i=$((i + 1))
          done
          exit "$rc"

      # Go bumps an entry's mtime on use, so this keeps only what this run touched.
      - name: Trim the Go build cache to what this run used
        if: inputs.mode != 'race' && github.event_name != 'pull_request' && steps.gocache.outputs.cache-hit != 'true'
        run: find "$(go env GOCACHE)" -type f -mmin +90 -delete

      # Never from a pull_request: that scope is readable by the one PR and nothing after it.
      - name: Save the Go caches
        if: inputs.mode != 'race' && github.event_name != 'pull_request' && steps.gocache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ steps.gocache.outputs.cache-primary-key }}
