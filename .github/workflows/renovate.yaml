# Self-hosted Renovate. Reads /renovate.json5 from the caller's cloned repo automatically.
# Afterwards every open PR labelled dep-major or dep-swap whose head has no verdict yet goes through the
# Copilot BC check in actions/renovate-bc-check, which arms auto-merge on SAFE.
name: Renovate (reusable)

on:
  workflow_call:
    inputs:
      log-level:
        description: Renovate log level
        type: string
        default: info
      dry-run:
        description: Dry run (extract + plan, open no PRs)
        type: boolean
        default: false
      allowed-commands:
        description: JSON array string for RENOVATE_ALLOWED_COMMANDS, e.g. '["^find \. -name Chart\.lock -exec sed -i "]'
        type: string
        default: '[]'
    secrets:
      RENOVATE_TOKEN:
        required: true

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read  # Renovate acts through RENOVATE_TOKEN, not GITHUB_TOKEN
  copilot-requests: write  # Copilot CLI in the BC check is the one thing that runs on GITHUB_TOKEN

env:
  cache_dir: /tmp/renovate/cache/renovate/repository  # renovate's own path, pointing it elsewhere breaks container perms

jobs:
  renovate:
    runs-on: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: restore renovate cache
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.cache_dir }}
          key: renovate-cache-${{ github.run_id }}-${{ github.run_attempt }}  # unique per run, so it never hits and every run saves a fresh one
          restore-keys: renovate-cache-  # the actual restore: newest previous cache

      - name: chown the restored cache
        if: steps.cache.outputs.cache-matched-key != ''
        # actions/cache restores as the runner user, renovate reads it as uid 12021 inside its container, and an
        # unreadable cache is silently treated as absent.
        run: sudo chown -R 12021:0 /tmp/renovate/

      - uses: renovatebot/github-action@9fea9f0fbf80401026d11d03911d62b1f70fef1f  # v46.3.3
        with:
          # A dedicated PAT: GITHUB_TOKEN cannot open PRs that re-trigger workflows, and lacks the scope.
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}  # this repo only, no org-wide autodiscover
          LOG_LEVEL: ${{ inputs.log-level }}
          RENOVATE_DRY_RUN: ${{ inputs.dry-run && 'full' || '' }}
          RENOVATE_ALLOWED_COMMANDS: ${{ inputs.allowed-commands }}
          # Without a restored cache Renovate cannot tell an open branch is still current, so it rebuilds and
          # force-pushes it every run, which restarts CI and starves automerge.
          RENOVATE_REPOSITORY_CACHE: enabled

      - name: save renovate cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ env.cache_dir }}
          key: renovate-cache-${{ github.run_id }}-${{ github.run_attempt }}

  list-bc-checks:
    needs: renovate
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-26.04-arm
    permissions: {}
    outputs:
      prs: ${{ steps.list.outputs.prs }}
    env:
      GH_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
    steps:
      - name: Open dep-major and dep-swap PRs without a verdict for their current head
        id: list
        run: |
          set -euo pipefail
          prs='[]'
          while IFS=$'\t' read -r number sha; do
            [ -n "$number" ] || continue
            if gh api "repos/$GITHUB_REPOSITORY/issues/$number/comments" --paginate --jq '.[].body' \
              | grep -q "renovate-bc-check head=$sha "; then
              continue
            fi
            prs=$(jq -c --argjson n "$number" '. + [$n]' <<< "$prs")
          done < <(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,headRefOid,labels \
            --jq '.[] | select(any(.labels[].name; . == "dep-major" or . == "dep-swap")) | [.number, .headRefOid] | @tsv')
          echo "prs=$prs" >> "$GITHUB_OUTPUT"
          echo "$prs"

  bc-check:
    needs: list-bc-checks
    if: needs.list-bc-checks.outputs.prs != '[]'
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    permissions:
      contents: read
      copilot-requests: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pr: ${{ fromJSON(needs.list-bc-checks.outputs.prs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/pull/${{ matrix.pr }}/head
          fetch-depth: 0

      # job.workflow_sha is this reusable workflow's own commit, so a caller pinned to @v2 runs the
      # v2 action. Second, because a checkout into the workspace root wipes what is already there.
      - name: Fetch the BC check action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .gha
          sparse-checkout: .github/actions/renovate-bc-check

      - uses: ./.gha/.github/actions/renovate-bc-check
        with:
          pr: ${{ matrix.pr }}
          token: ${{ secrets.RENOVATE_TOKEN }}
