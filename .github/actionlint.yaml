# ubuntu-slim is a GitHub-hosted label that actionlint 1.7.7 does not know yet.
self-hosted-runner:
  labels:
    - ubuntu-slim

paths:
  .github/workflows/go-ci.yaml:
    ignore:
      # actionlint 1.7.7 does not carry job_workflow_sha in its github context type.
      - 'property "job_workflow_sha" is not defined'
