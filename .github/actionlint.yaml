# ubuntu-slim is a GitHub-hosted label that actionlint 1.7.7 does not know yet.
self-hosted-runner:
  labels:
    - ubuntu-slim

paths:
  .github/workflows/docker-build-release*.yaml:
    ignore:
      # actionlint 1.7.x has not caught up with the job context's workflow identity properties
      - 'property "workflow_(sha|repository)" is not defined'
